<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Partnerio paskyra | 2uno</title>
<style>
:root{--ink:#10245f;--brand:#102b70;--teal:#279da7;--muted:#64758e;--paper:#f4f7fc;--line:#dce5f1;--err:#b42318;--ok:#0f6b46}
[hidden]{display:none!important}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:Arial,Helvetica,sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);padding:8px 24px;display:flex;align-items:center;gap:16px}
header img{height:52px}header .who{margin-left:auto;font-size:13px;color:var(--muted);display:flex;gap:12px;align-items:center}
main{max-width:1050px;margin:28px auto 60px;padding:0 18px}
h1{font-size:28px;margin:0 0 6px}p.lead{color:var(--muted);margin:0 0 22px;line-height:1.6}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px}
.login{max-width:440px;margin:40px auto}
label{display:block;font-size:13px;font-weight:600;margin-top:14px}
input{width:100%;margin-top:6px;border:1px solid #c5d6e3;border-radius:8px;padding:12px;font:inherit;color:var(--ink)}
input.code{font-size:24px;letter-spacing:8px;text-align:center}
button{border:0;background:var(--brand);color:#fff;border-radius:9px;padding:12px 18px;font:inherit;font-weight:600;cursor:pointer}
button.light{background:#eaf5f8;color:var(--ink);border:1px solid #c8dfe8}button.danger{background:#fff;color:var(--err);border:1px solid #f1c3c0}
button:disabled{opacity:.6;cursor:wait}.full{width:100%;margin-top:16px}
.msg{font-size:13px;padding:10px 13px;border-radius:8px;margin-top:12px;display:none;line-height:1.5}
.msg.ok{display:block;background:#e9f8f1;color:var(--ok)}.msg.warn{display:block;background:#fff6e0;color:#7a5200}.msg.bad{display:block;background:#fdecec;color:var(--err)}
.grid{display:grid;grid-template-columns:360px 1fr;gap:18px;align-items:start}
.list{display:flex;flex-direction:column;gap:10px}
.item{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;cursor:pointer;text-align:left;color:var(--ink);font-weight:400}
.item.active{border-color:var(--teal);box-shadow:0 0 0 2px #9fdde0}
.item b{display:block;font-size:14px;margin-bottom:4px}.item small{color:var(--muted)}
.badge{display:inline-block;font-size:11px;border-radius:20px;padding:4px 9px;margin-top:8px;background:#eef2f8;color:#3b4b66}
.badge.wait{background:#fff4d6;color:#7a5200}.badge.open{background:#e3f6ee;color:var(--ok)}.badge.off{background:#f1f1f1;color:#777}
dl{display:grid;grid-template-columns:190px 1fr;gap:9px 14px;font-size:14px;margin:14px 0}dt{color:var(--muted)}dd{margin:0}
.lock{background:#f6f8fc;border:1px dashed #b9c8de;border-radius:10px;padding:16px;font-size:14px;color:#3b4b66;line-height:1.6}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.empty{color:var(--muted);font-size:14px}.testbox{margin-top:18px;font-size:12px;color:var(--muted);border-top:1px dashed var(--line);padding-top:14px}
@media(max-width:820px){.grid{grid-template-columns:1fr}dl{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><img src="assets/2uno-logo.jpg" alt="2uno.lt"><div class="who" id="who" hidden><span id="whoName"></span><button class="light" id="logout">Atsijungti</button></div></header>
<main>
  <section id="loginView" class="login card" hidden>
    <h1>Partnerio paskyra</h1>
    <p class="lead">Prisijungimui naudojamas vienkartinis kodas, siunčiamas į jūsų el. paštą.</p>
    <form id="emailForm">
      <label>El. paštas<input name="email" type="email" autocomplete="email" required></label>
      <button class="full" id="sendBtn">Gauti kodą</button>
    </form>
    <form id="codeForm" hidden>
      <label>6 skaitmenų kodas<input class="code" name="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" required></label>
      <button class="full" id="verifyBtn">Prisijungti</button>
    </form>
    <div class="msg" id="loginMsg"></div>
    <div class="testbox">Testinė aplinka: <button class="light" id="seedBtn" type="button">Sukurti demo užklausą šiam el. paštui</button><div class="msg" id="seedMsg"></div></div>
  </section>

  <section id="appView" hidden>
    <h1>Klientų užklausos</h1>
    <p class="lead">Kliento duomenys ir sutartis atrakinami automatiškai, kai tik apmokamas komisinis.</p>
    <div class="grid">
      <div class="list" id="list"></div>
      <div class="card" id="detail"><p class="empty">Pasirinkite užklausą.</p></div>
    </div>
    <div class="testbox">Testinė aplinka: <button class="light" id="seedBtn2" type="button">Sukurti naują demo užklausą</button></div>
  </section>
</main>
<script src="assets/partneris.js"></script>
</body>
</html>
